   <path d="M-11 -150h22v260h-22z" fill="url(#gold)" opacity=".35"/>
  </g>
  <g transform="rotate(30)">
   <path d="M-13 -170h26v284h-26z" fill="#6c4d33"/>
   <path d="M-57 -184h114v38h-114z" fill="url(#steel)"/>
   <path d="M-10 -146h20v256h-20z" fill="url(#gold)" opacity=".35"/>
  </g>
 </g>
