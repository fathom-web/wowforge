 <path d="M0 -145L100 -108L136 -29L110 88L0 150L-110 88L-136 -29L-100 -108Z" fill="url(#steel)" stroke="#322a22" stroke-width="5"/>
 <path d="M0 -128L89 -93L116 -23L95 74L0 130L-95 74L-116 -23L-89 -93Z" fill="url(#core)" stroke="#ba935a" stroke-width="2.7"/>
 <path d="M0 -123L83 -88L108 -20L88 66L0 119L-88 66L-108 -20L-83 -88Z" fill="none" stroke="#d6b57a" opacity=".5" stroke-width="1.5"/>
 <g fill="#fff0b8" stroke="#583d22" stroke-width="2">
  <circle cx="0" cy="-151" r="7"/><circle cx="119" cy="-31" r="7"/><circle cx="0" cy="147" r="7"/><circle cx="-119" cy="-31" r="7"/>
