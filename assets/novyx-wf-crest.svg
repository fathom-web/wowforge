<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="logoTitle logoDesc">
<title id="logoTitle">NOVYX Forge — original WF emblem</title>
<desc id="logoDesc">An original dark-forged hexagonal shield with a WF monogram, a smithing anvil, copper rivets, teal inlays and a ring of golden sparks. Not affiliated with any game publisher.</desc>
<defs>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1b7a1"/><stop offset=".2" stop-color="#4c4c48"/><stop offset=".51" stop-color="#1d2629"/><stop offset=".8" stop-color="#52514b"/><stop offset="1" stop-color="#b09a72"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".77" y2="1"><stop stop-color="#fff1c0"/><stop offset=".18" stop-color="#dcb470"/><stop offset=".52" stop-color="#a76b32"/><stop offset=".76" stop-color="#f3d299"/><stop offset="1" stop-color="#a77639"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#325b63"/><stop offset=".5" stop-color="#152e33"/><stop offset="1" stop-color="#0d1b22"/></linearGradient>
 <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffa568"/><stop offset="1" stop-color="#673323"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#4c7166"/><stop offset=".42" stop-color="#244341"/><stop offset="1" stop-color="#0a171c"/></radialGradient>
 <filter id="shadow" x="-55%" y="-60%" width="210%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<g transform="translate(320 207)">
 <ellipse cx="0" cy="169" rx="137" ry="20" fill="#000" opacity=".42" filter="url(#shadow)"/>
 <!-- Original forge tools: square-headed smithing hammers, not weapon insignia -->
