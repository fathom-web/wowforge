 <text x="0" y="45" fill="url(#gold)" stroke="#e6ce92" stroke-width="1.2" paint-order="stroke" text-anchor="middle" font-family="Georgia,serif" font-size="102" font-weight="bold" letter-spacing="-12">WF</text>
