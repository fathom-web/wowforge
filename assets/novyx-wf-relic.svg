<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="forgelogo-title forgelogo-desc">
<title id="forgelogo-title">NOVYX Forge — The Veteran's Mark</title>
<desc id="forgelogo-desc">An original battle-worn smithing anvil emblem, with a rough forged-iron plate, copper rivets, crossed blacksmith hammers, and oversized WF initials. No publisher-owned game marks.</desc>
