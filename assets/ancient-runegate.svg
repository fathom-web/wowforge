<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title"><title>Original ancient rune gate wrapped in forest roots</title>
<defs>
<linearGradient id="stone" x1="0" x2=".87" y1="0" y2="1"><stop stop-color="#b7a77a"/><stop offset=".16" stop-color="#756e53"/><stop offset=".45" stop-color="#3c463c"/><stop offset=".73" stop-color="#283b35"/><stop offset="1" stop-color="#111e1c"/></linearGradient>
