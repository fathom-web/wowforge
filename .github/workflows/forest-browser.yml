name: Forest Frontier browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/forest-browser.yml'
  pull_request:
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/forest-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest-qa:
    name: Forest desktop / tablet / mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 > /tmp/wowforge-server.log 2>&1 &
          sleep 2
      - name: Verify forest artwork and responsive journeys
        run: node tests/forest-browser.mjs
      - name: Preserve visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-frontier-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 14
